  <!-- Custom CSS for Reference Site Animations, Mobile Safeguards & White/Green Theme -->
  <style>
    html, body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
    }
    @keyframes donateShine {
      0% { transform: translateX(-200%) skew(-20deg); }
      60%, 100% { transform: translateX(300%) skew(-20deg); }
    }
    .donate-shine {
      position: relative;
      overflow: hidden;
    }
    .donate-shine::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: donateShine 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes donateDance {
      0%, 100% { transform: translateY(0) rotate(0); }
      20% { transform: translateY(-4px) rotate(1.5deg); }
      40% { transform: translateY(0) rotate(0); }
      60% { transform: translateY(-3px) rotate(-1.5deg); }
      80% { transform: translateY(0) rotate(0); }
    }
    .donate-dance {
      animation: donateDance 3.5s ease-in-out infinite;
    }
    @keyframes kenBurns {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .animate-ken-burns {
      animation: kenBurns 18s ease-in-out infinite alternate;
    }
    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marqueeScroll 25s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    /* Fallback and safeguard: guarantee elements with data-aos are always visible */
    [data-aos] {
      opacity: 1 !important;
      transform: none !important;
      visibility: visible !important;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Hide scrollbars for clean mobile tab scrolling */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
